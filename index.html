    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
    <title>Remix Sistem Presensi Siswa MySQL V3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Lexend:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Merriweather:wght@400;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Oswald:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800;900&family=Ubuntu:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <body class="font-sans antialiased min-h-screen h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root" class="min-h-full">
      <div style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background-color:#020617; color:#f8fafc; font-family:'Plus Jakarta Sans', system-ui, sans-serif; z-index:9999;">
        <div style="position:relative; width:80px; height:80px; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
          <div style="position:absolute; inset:0; border-radius:50%; border:3px solid rgba(99,102,241,0.15); border-top-color:#6366f1; animation:spin 0.8s linear infinite;"></div>
          <img src="/app-icon.svg" alt="Logo" style="width:40px; height:40px; object-fit:contain;" />
        </div>
        <div style="font-size:15px; font-weight:800; letter-spacing:0.05em; color:#f1f5f9; text-transform:uppercase;">SMK NEGERI 6 GARUT</div>
        <div style="font-size:12px; font-weight:500; color:#94a3b8; margin-top:6px;">Memuat Absensi Siswa...</div>
        <div style="width:180px; height:3px; background-color:#1e293b; border-radius:9999px; overflow:hidden; margin-top:24px;">
          <div style="width:100%; height:100%; background:linear-gradient(90deg, #3b82f6, #6366f1, #10b981); animation:pulse 1.5s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
