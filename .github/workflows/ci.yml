name: CI

on:
  push:
    branches: ["main", "security-hardening-2026-10"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Package source archive
        run: zip -r absen-OK-security-hardening-2026-10.zip . -x ".git/*"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: absen-OK-security-hardening-2026-10
          path: absen-OK-security-hardening-2026-10.zip
          if-no-files-found: error
